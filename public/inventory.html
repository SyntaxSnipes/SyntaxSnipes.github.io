<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="istyle.css">
    <!-- Favicon for better branding -->
    <link rel="icon" href="images/BookbackICON.png" type="image/png">
    <!-- Link to external libraries can be included here if necessary -->
    <!-- Example: <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> -->
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>
    <div id="navbar">
        <img src="images/BookbackICON.png" alt="BookBack Logo" aria-label="BookBack Logo">
        <label class="hamburger-menu">
            <input type="checkbox" aria-label="Toggle Menu" />
        </label>
        <aside class="sidebar">
            <nav>
                <a href="index.html">Home</a>
                <a href="inventory.html">Inventory</a>
            </nav>
        </aside>
    </div>
    <section id="sec1">
        <span id="search">
            <input type="text" id="search-input" placeholder="Search for a book by name" aria-label="Search for a book by name">
            <button id="search-button">Search</button>
        </span>
        
        <ul id="book-list"></ul>
    </section>

    <script>
        // Load and hide the loading screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.display = 'none';
            }, 1500);
        });

        let books = [];  // Store books globally for searching
        let uniqueBooks = [];  // Store deduplicated books globally
        let duplicateCounts = {};  // Store duplicate counts globally

        // Function to deduplicate books based on ISBN (excluding last 5 digits) and grade
        function deduplicateBooks(data) {
            const uniqueBooksMap = {};
            duplicateCounts = {};

            data.forEach(book => {
                const isbnFull = book.id.split('-')[0]; // Use the full ISBN without trimming the last 5 digits
                const grade = book.grade; // Get the grade

                // Create a unique key combining the full ISBN and grade
                const uniqueKey = `${isbnFull}-${grade}`;

                // Count duplicates
                if (duplicateCounts[uniqueKey]) {
                    duplicateCounts[uniqueKey]++;
                } else {
                    duplicateCounts[uniqueKey] = 1;
                    uniqueBooksMap[uniqueKey] = book; // Store unique book information
                }
            });

            // Convert uniqueBooksMap back to an array for display
            return Object.values(uniqueBooksMap);
        }

        async function fetchBooks() {
    try {
        const response = await fetch('http://localhost:3001/api/books'); 
        if (!response.ok) {
            console.error('Network response was not ok');
            return; // Exit if the response is not okay
        }
        const text = await response.text(); // Read response as text
        console.log('Response text:', text); // Log the response text
        const data = JSON.parse(text); // Parse text to JSON
        uniqueBooks = deduplicateBooks(data); // Deduplicate books on fetch
        console.log('Deduplicated books:', uniqueBooks); // Log the unique books
        displayBooks(uniqueBooks); // Display all books
    } catch (error) {
        console.error('Fetch error:', error);
    }
}


        function displayBooks(booksToDisplay) {
            const bookList = document.getElementById('book-list');
            bookList.innerHTML = ''; // Clear the current list

            const listItems = [];

            booksToDisplay.forEach(book => {
                const isbn = book.id.split('-')[0]; // Extract full ISBN part
                const li = document.createElement('li');
                li.style.cursor = 'pointer'; // Change cursor to pointer for better UX

                const img = document.createElement('img');
                img.style.borderRadius = '4px';
                img.style.maxWidth = '200px'; // Adjust the image size as needed

                // Fetch the Open Library API URL using the cleaned ISBN
                const openBooksApiUrl = `https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`;
                console.log(`Fetching Open Library API for ISBN: ${isbn}`);

                // Fetch Open Library data
                fetch(openBooksApiUrl)
                    .then(response => response.json())
                    .then(openData => {
                        const bookData = openData[`ISBN:${isbn}`];

                        // Try Google Books first, then Open Library
                        fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`)
                            .then(googleResponse => googleResponse.json())
                            .then(googleData => {
                                // Check for Google Books image first
                                if (googleData.items && googleData.items.length > 0) {
                                    img.src = googleData.items[0].volumeInfo.imageLinks.thumbnail; // Use thumbnail if available
                                } else if (bookData && bookData.cover) {
                                    // Use Open Library image link if available
                                    img.src = bookData.cover.medium || bookData.cover.large; // Use medium or large cover image
                                } else {
                                    img.src = 'https://via.placeholder.com/200x300?text=No+Cover+Available'; // Fallback to placeholder
                                }
                            })
                            .catch(error => {
                                console.error('Error fetching Google Books data:', error);
                                img.src = 'https://via.placeholder.com/200x300?text=No+Cover+Available'; // Fallback to placeholder
                            });
                    })
                    .catch(error => {
                        console.error('Error fetching Open Books data:', error);
                        img.src = 'https://via.placeholder.com/200x300?text=No+Cover+Available'; // Fallback to placeholder
                    });

                li.appendChild(img);
                let priceDisplay = 'Price not available';
                if (book.price && !isNaN(book.price)) {
                    priceDisplay = `AED ${parseFloat(book.price).toFixed(2)}`;
                }
                li.appendChild(document.createTextNode(book.name || 'Title not available'));
                li.appendChild(document.createElement('br'));
                li.appendChild(document.createTextNode(`Grade: ${book.grade}`));
                li.appendChild(document.createElement('br'));
                li.appendChild(document.createTextNode(`${priceDisplay}`));

                const countKey = `${book.id.split('-')[0]}-${book.grade}`;  // Use full ISBN and grade as the key
                const countDisplay = `No. in stock: ${duplicateCounts[countKey] || 1}`; // Fallback to 1
                li.appendChild(document.createElement('br'));
                li.appendChild(document.createTextNode(countDisplay));

                const isbnInfo = document.createElement('span');
                isbnInfo.textContent = `ISBN: ${book.id}`;
                isbnInfo.style.display = 'none'; // Hide it initially
                li.appendChild(isbnInfo);

                // Click event to show/hide ISBN
                li.onclick = (event) => {
                    event.stopPropagation();
                    listItems.forEach(item => {
                        item.style.filter = 'none';
                        const isbnSpan = item.querySelector('span');
                        if (isbnSpan) {
                            isbnSpan.style.display = 'none';
                        }
                    });

                    if (isbnInfo.style.display === 'none') {
                        isbnInfo.style.display = 'inline';
                        li.style.filter = 'none';
                    } else {
                        isbnInfo.style.display = 'none';
                    }

                    li.style.filter = 'none';
                    listItems.forEach(item => {
                        if (item !== li) {
                            item.style.filter = 'blur(5px)';
                        }
                    });
                };

                listItems.push(li);
                bookList.appendChild(li);
            });

            // Handle click events outside list items
            document.addEventListener('click', () => {
                listItems.forEach(item => {
                    item.style.filter = 'none';
                    const isbnSpan = item.querySelector('span');
                    if (isbnSpan) {
                        isbnSpan.style.display = 'none';
                    }
                });
            });
        }

        // Function to search books by name
        function searchBooks() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredBooks = uniqueBooks.filter(book => book.name.toLowerCase().includes(searchTerm));
            displayBooks(filteredBooks);
        }

        // Event listener for the search button
        document.getElementById('search-button').addEventListener('click', searchBooks);

        // Initial fetch of books
        fetchBooks();
    </script>
</body>
</html>
